<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - Brigada Hostel</title>
    <link rel="stylesheet" href="../../../style/dashboard.css">
</head>
<body class="bg-light">

    <input type="checkbox" id="menu-cb" hidden>
    <label for="menu-cb" class="sidebar-overlay"></label>

    <aside class="bg-dark text-white">
        <div class="sidebar-brand p-4 border-bottom border-secondary">
            <div class="d-flex align-items-center gap-3">
                <div class="bg-primary p-2 rounded shadow-sm">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </div>
                <div>
                    <h2 class="h6 mb-0 fw-bold text-uppercase">Brigada Hostel</h2>
                    <p class="small text-secondary mb-0">Gestión Interna</p>
                </div>
            </div>
        </div>
        <nav class="p-3">
            <ul class="nav flex-column gap-1">
                <li class="nav-item"><a href="../dashboard.html" class="nav-link text-secondary rounded d-flex align-items-center gap-3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg> Resumen</a></li>
                <li class="nav-item"><a href="reservas.html" class="nav-link text-secondary rounded d-flex align-items-center gap-3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line></svg> Reservas</a></li>
                <li class="nav-item"><a href="recepcion.html" class="nav-link text-secondary rounded d-flex align-items-center gap-3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg> Recepción</a></li>
                <li class="nav-item"><a href="configuracion.html" class="nav-link active rounded d-flex align-items-center gap-3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09"></path></svg> Configuración</a></li>
            </ul>
        </nav>
    </aside>

    <header class="bg-white shadow-sm px-4 py-3 d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3">
            <label for="menu-cb" class="btn btn-light d-lg-none">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </label>
            <div>
                <h1 class="h4 mb-0 fw-bold text-dark">Configuración</h1>
                <p class="small text-muted mb-0">Ajustes del sistema y perfil</p>
            </div>
        </div>
        <div class="user-info d-flex align-items-center gap-2 px-3 py-1 bg-light rounded-pill border">
            <span class="fw-bold small text-primary">Administrador</span>
            <div class="bg-secondary rounded-circle p-1" style="width: 28px; height: 28px;">
                <svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
        </div>
    </header>

    <main class="p-4">
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm p-4 text-center">
                    <p class="small fw-bold text-muted text-uppercase mb-2">Estado</p>
                    <div class="h5 fw-bold text-success mb-0">Verificada</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm p-4 text-center">
                    <p class="small fw-bold text-muted text-uppercase mb-2">Rol</p>
                    <div class="h5 fw-bold text-primary mb-0">Super Admin</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm p-4 text-center">
                    <p class="small fw-bold text-muted text-uppercase mb-2">Seguridad</p>
                    <div class="h5 fw-bold mb-0">Alta</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm p-4 text-center">
                    <p class="small fw-bold text-muted text-uppercase mb-2">Versión</p>
                    <div class="h5 fw-bold mb-0">v2.4.8</div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-6">
                <section class="card border-0 shadow-sm p-4">
                    <h2 class="h5 fw-bold mb-4">Perfil de Usuario</h2>
                    <form>
                        <div class="mb-3 text-center">
                            <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center border" style="width: 80px; height: 80px;">
                                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            </div>
                            <div class="mt-2">
                                <button type="button" class="btn btn-sm btn-outline-secondary">Cambiar Imagen</button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nombre</label>
                            <input type="text" class="form-control" value="Administrador Principal">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Email</label>
                            <input type="email" class="form-control" value="admin@brigadahostel.com">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Guardar Cambios</button>
                    </form>
                </section>
            </div>

            <div class="col-lg-6">
                <section class="card border-0 shadow-sm p-4">
                    <h2 class="h5 fw-bold mb-4">Preferencias</h2>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Idioma</label>
                        <select class="form-select">
                            <option>Español</option>
                            <option>English</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Tema</label>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-light border flex-grow-1 py-3 fw-bold active">Claro</button>
                            <button type="button" class="btn btn-dark flex-grow-1 py-3 fw-bold">Oscuro</button>
                        </div>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="notif1" checked>
                        <label class="form-check-label small" for="notif1">Notificaciones por Email</label>
                    </div>
                </section>
            </div>
        </div>
    </main>

</body>
</html>
